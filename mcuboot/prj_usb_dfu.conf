#
# MCUboot with USB DFU recovery, used instead of prj.conf by the variants that
# set SB_CONFIG_ARDUINO_MCUBOOT_USB_DFU=y in their sysbuild.conf. The board adds
# its own boards/<board>.conf and .overlay.

CONFIG_PM=n
CONFIG_MAIN_STACK_SIZE=10240
CONFIG_FLASH=y
CONFIG_BOOT_SWAP_SAVE_ENCTLV=n
CONFIG_BOOT_ENCRYPT_IMAGE=n
CONFIG_BOOT_UPGRADE_ONLY=n

# Force ECDSA-P256, since this is not necessarily the default
CONFIG_BOOT_SIGNATURE_TYPE_RSA=n
CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y

# USB DFU, alt 0 = slot1 only: uploads are staged in the secondary slot
CONFIG_BOOT_USB_DFU=y
CONFIG_USBD_DFU_FLASH_SLOT0=n
CONFIG_USBD_DFU_FLASH_SLOT1=y
CONFIG_USBD_DFU_NUMOF_IMAGES=1
CONFIG_USBD_DFU_ENABLE_UPLOAD=n
CONFIG_USBD_CDC_ACM_CLASS=n

# Enter USB DFU when the boot-mode retention area asks for it
# (loader/mcuboot_hooks), as the loader's 1200 bps touch and the burner do
CONFIG_RETAINED_MEM=y
CONFIG_RETENTION=y
CONFIG_RETENTION_BOOT_MODE=y
CONFIG_ARDUINO_MCUBOOT_DFU_BOOT_MODE=y

CONFIG_CBPRINTF_NANO=y
CONFIG_PICOLIBC=y
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=0

CONFIG_LOG=n
CONFIG_PRINTK=n
CONFIG_BOOT_BANNER=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n

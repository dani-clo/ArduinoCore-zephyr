#
# MCUboot in the whole 128K BFM (Single Boot), updated over SWD or with the
# burner. USB DFU recovery (prj_usb_dfu.conf, see the variant's sysbuild.conf).

# Loader + sketch in one ECDSA-P256 signed image; tinycrypt is the smallest backend.
CONFIG_BOOT_ECDSA_TINYCRYPT=y

CONFIG_ROMSTART_RELOCATION_ROM=n
CONFIG_USE_DT_CODE_PARTITION=y

# Swap-using-offset (sysbuild.conf): USB DFU and OTA both stage into slot1.
# A permanent update (USB) overwrites slot0, a test update (OTA) is swapped:
# bootstrap copies when slot0 is invalid, loader/mcuboot_hooks says it is while
# a permanent request is pending.
CONFIG_UPDATEABLE_IMAGE_NUMBER=1
CONFIG_BOOT_BOOTSTRAP=y
CONFIG_BOOT_IMAGE_ACCESS_HOOKS=y

# 1 MB slots of 4 KB sectors; auto-detection misses microchip,flash-g3.
CONFIG_BOOT_MAX_IMG_SECTORS_AUTO=n
CONFIG_BOOT_MAX_IMG_SECTORS=256

# A USB upload overwrites slot0 for good; OTA images run as a test until the
# sketch confirms them.
CONFIG_BOOT_USB_DFU_PERMANENT_DOWNLOAD=y
# 1 KB DFU blocks (Zephyr's maximum): half the round trips of 512 B.
CONFIG_USBD_DFU_TRANSFER_SIZE=1024
CONFIG_UDC_BUF_POOL_SIZE=4096

CONFIG_BOOT_USB_DFU_VID=0x2341
CONFIG_BOOT_USB_DFU_PID=0x017e
CONFIG_BOOT_USB_DFU_MANUFACTURER_STRING="Arduino"
CONFIG_BOOT_USB_DFU_PRODUCT_STRING="Nano XL Link bootloader"

# DFU entrance: double tap through the retention
# boot mode (loader/mcuboot_hooks); the 1200-bps touch starts the loader's DFU.
# Double tap arms before clock bring-up (hundreds of ms on this SoC).
CONFIG_RETAINED_MEM_INIT_PRIORITY=0
CONFIG_ARDUINO_MCUBOOT_DOUBLE_TAP=y
# Fade LED_BUILTIN (mcuboot-fade-led0) while waiting in USB DFU.
CONFIG_ARDUINO_MCUBOOT_DFU_FADE_LED=y

CONFIG_SERIAL=n
CONFIG_FAULT_DUMP=0
CONFIG_ARM_MPU=n
CONFIG_INTC_MCHP_EIC_G1=n

# Empirical minimums for the UDC driver + DFU traffic.
CONFIG_USBD_THREAD_STACK_SIZE=4096

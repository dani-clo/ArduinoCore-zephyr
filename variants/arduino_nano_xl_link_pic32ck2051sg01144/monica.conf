#
# Nano XL Link "Monica" carrier - Kconfig delta.
#
# Monica is not a Zephyr board variant: it is the plain arduino_nano_xl_link
# board plus the "arduino_nano_xl_link_monica" shield. This file is merged *after*
# the variant's own arduino_nano_xl_link_pic32ck2051sg01144.conf (it is passed
# as EXTRA_CONF_FILE from nanoxllink_monica.build.zephyr_args in boards.txt),
# so only the differences belong here.
#

# USB identity of the carrier (bare module is 0x007e / "Arduino Nano XL Link").
CONFIG_USB_DEVICE_PRODUCT="Arduino Nano XL Link Monica"
CONFIG_USB_DEVICE_PID=0x008e
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="Arduino Nano XL Link Monica"

# IPv6 off, matching the bare module. This line used to read =y, which silently
# overrode the variant's CONFIG_NET_IPV6=n and cost 24928 B of flash and 4.6 KB
# of RAM for a stack nothing here reaches: the carrier's networking is DHCPv4
# over ESP-AT or Ethernet, no Arduino library opens an AF_INET6 socket, and
# turning it off produces no unmet-dependency warning.
#
# That headroom is what makes an SMP server in the loader possible at all -
# sketch-only uploads and OTA both need one, and the loader had 13 KB free.
# Turn it back on only with a use for it, and re-check the loader against
# build.ota.offset (288K) if you do.
CONFIG_NET_IPV6=n

# ESP-AT offloads TCP/UDP, but getaddrinfo() still uses Zephyr's resolver.
# Keep the base variant's static DNS server: the stock AT firmware does not
# populate the resolver through AT+CIPDNS?.
CONFIG_DNS_RESOLVER=y

# ESP8266 AT WiFi module on sercom1, added by the shield's devicetree overlay.
# The AT firmware revision is selected by the shield's Kconfig.defconfig.
CONFIG_WIFI=y
CONFIG_WIFI_ESP_AT=y
# The module's stock AT 1.3.0.0 firmware answers ERROR to AT+CIPRECVMODE=1
# (passive receive mode needs AT >= 1.4), which makes the driver's init fail
# and leaves no Wi-Fi interface. Keep the default active (+IPD push) mode.
CONFIG_WIFI_ESP_AT_PASSIVE_MODE=n
CONFIG_UART_INTERRUPT_DRIVEN=y

# AT+CIPDINFO=1, so +IPD carries the peer's address and the driver can fill
# net_pkt->remote (esp_socket.c:150). Without it a UDP recvfrom() returns no
# source address at all, and the socket layer turns that into ENOTSUP rather
# than delivering the datagram (sockets_inet.c:1254) - which is exactly how a
# server socket such as mcumgr's SMP/UDP fails: the packet arrives, the module
# hands it over, and recvfrom() still reports an error.
#
# Keep peer addresses available for UDP recvfrom(), including DNS replies.
CONFIG_WIFI_ESP_AT_CIPDINFO_USE=y

# Native TLS over the ESP-AT TCP sockets, used by ZephyrSSLClient.
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
# Keep the TLS heap in the loader (default MBEDTLS_INIT=y), outside the
# sketch's 64 KiB data limit.
CONFIG_MBEDTLS_HEAP_SIZE=60000
# Allow server certificate chains without enlarging the outgoing buffer.
CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=7168
CONFIG_MBEDTLS_SSL_SERVER_NAME_INDICATION=y
CONFIG_MBEDTLS_PEM_PARSE_C=y
# TLS 1.2 with RSA or ECDSA server certificates; dependencies are selected
# by the ciphersuite options in Zephyr's Mbed TLS 4 integration.
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256=y
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256=y

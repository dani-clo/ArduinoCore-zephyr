#
# Nano Chandler "Monica" carrier - Kconfig delta.
#
# Monica is not a Zephyr board variant: it is the plain arduino_nano_chandler
# board plus the "nano_chandler_monica" shield. This file is merged *after*
# the variant's own arduino_nano_chandler_pic32ck1025gc01144.conf (it is passed
# as EXTRA_CONF_FILE from nano_chandler_monica.build.zephyr_args in boards.txt),
# so only the differences belong here.
#

# USB identity of the carrier (bare module is 0x007e / "Arduino Nano Chandler").
CONFIG_USB_DEVICE_PRODUCT="Arduino Nano Chandler Monica"
CONFIG_USB_DEVICE_PID=0x008e
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="Arduino Nano Chandler Monica"

# IPv6 off, matching the bare module. This line used to read =y, which silently
# overrode the variant's CONFIG_NET_IPV6=n and cost 24928 B of flash and 4.6 KB
# of RAM for a stack nothing here reaches: the carrier's networking is DHCPv4
# over ESP-AT or Ethernet, no Arduino library opens an AF_INET6 socket, and
# turning it off produces no unmet-dependency warning.
#
# Turn it back on only with a use for it, and re-check the TLS loader
# against the shared 320 KiB partition if you do.
CONFIG_NET_IPV6=n

# The bare module enables the DNS resolver with a static 8.8.8.8 server; on
# Monica the addresses come from the ESP-AT module instead, so the static
# resolver stays off. Flip these back on (together with
# CONFIG_WIFI_ESP_AT_DNS_USE) when testing a fixed resolver.
CONFIG_DNS_RESOLVER=n
CONFIG_DNS_SERVER_IP_ADDRESSES=n

# ESP8266 AT WiFi module on sercom1, added by the shield's devicetree overlay.
# The AT firmware revision is selected by the shield's Kconfig.defconfig.
CONFIG_WIFI=y
CONFIG_WIFI_ESP_AT=y
CONFIG_WIFI_ESP_AT_PASSIVE_MODE=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# AT+CIPDINFO=1, so +IPD carries the peer's address and the driver can fill
# net_pkt->remote (esp_socket.c:150). Without it a UDP recvfrom() returns no
# source address at all, and the socket layer turns that into ENOTSUP rather
# than delivering the datagram (sockets_inet.c:1254) - which is exactly how a
# server socket such as mcumgr's SMP/UDP fails: the packet arrives, the module
# hands it over, and recvfrom() still reports an error.
#
# It defaults to y only when DNS_RESOLVER is enabled, and this file turns the
# resolver off, so it has to be asked for explicitly here.
CONFIG_WIFI_ESP_AT_CIPDINFO_USE=y

# Native TLS over the ESP-AT TCP transport (ZephyrSSLClient).
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_USER_CONFIG_FILE="monica_mbedtls_config.h"
CONFIG_MBEDTLS_ENABLE_HEAP=y
# ZephyrSSLClient reserves and initializes TLS memory only in TLS sketches.
CONFIG_MBEDTLS_INIT=n
CONFIG_MBEDTLS_HEAP_SIZE=60000
CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN=16384
CONFIG_MBEDTLS_SSL_SERVER_NAME_INDICATION=y
CONFIG_MBEDTLS_PEM_PARSE_C=y
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256=y
# Add ECDHE-RSA without the RSA key-generation code selected by the preset.
CONFIG_MBEDTLS_KEY_EXCHANGE_ECDHE_RSA_ENABLED=y
CONFIG_PSA_WANT_KEY_TYPE_RSA_KEY_PAIR_IMPORT=y
CONFIG_PSA_WANT_ALG_RSA_PSS=y
CONFIG_PSA_WANT_ALG_RSA_PKCS1V15_SIGN=y

# Use the PIC32CK TRNG for TLS entropy, never the test random generator.
CONFIG_TEST_RANDOM_GENERATOR=n

# Reduce flash usage and keep TLS within 256 KiB SRAM.
CONFIG_LOG_DEFAULT_LEVEL=1
CONFIG_LTO=n
CONFIG_SIZE_OPTIMIZATIONS_AGGRESSIVE=y
# 24 x 128-byte fragments per direction; ESP-AT offloads TCP buffering.
CONFIG_NET_PKT_RX_COUNT=8
CONFIG_NET_PKT_TX_COUNT=8
CONFIG_NET_BUF_RX_COUNT=24
CONFIG_NET_BUF_TX_COUNT=24
# Allow TLS sketches to allocate the 60000-byte Mbed TLS arena in LLEXT RAM.
# Non-TLS sketches can use this same memory for their own data and allocations.
CONFIG_LLEXT_HEAP_SIZE=100
